# Tests DI-ana's page (the demo, photos, the live camera with a pretend camera), then puts the web copy on GitHub Pages:
# https://purpleninjaradish.github.io/DI-ana/  (the demo with invented students).
name: DI-ana on GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "odin/**"
      - "tools/**"
      - "VERSION"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build the page
        run: python3 web/build.py
      - name: Get the test tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils qpdf
          python3 -m pip install -q playwright pillow numpy
          python3 -m playwright install --with-deps chromium
      - name: Test the page
        run: DIANA_TEST_OUT=test-out python3 web/tests/test_diana.py
      - name: Keep the test pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: page-test
          path: test-out
          retention-days: 7

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # GitHub Pages is turned on once, by the repository's owner: Settings › Pages › Source: GitHub Actions.
      - name: Is GitHub Pages on for this repository?
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" --silent 2>/dev/null; then echo "on=true" >> "$GITHUB_OUTPUT"
          else echo "on=false" >> "$GITHUB_OUTPUT"; echo "::notice::GitHub Pages is off for this repository. Turn it on in Settings > Pages > Source: GitHub Actions, then run this workflow again."; fi
      - uses: actions/checkout@v4
        if: steps.pages.outputs.on == 'true'
      - name: Build the page
        if: steps.pages.outputs.on == 'true'
        run: python3 web/build.py
      - uses: actions/configure-pages@v5
        if: steps.pages.outputs.on == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.on == 'true'
        with:
          path: dist
      - id: deployment
        if: steps.pages.outputs.on == 'true'
        uses: actions/deploy-pages@v4
